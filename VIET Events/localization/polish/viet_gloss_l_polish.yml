 BETTING_ON_BOOKS_GLOSS: "#bold Betting on books and spilling tea#! refers to a famous Chinese historical anecdote from the Sòng Dynasty about the greatest female Chinese poet, the brilliant [Glossary( 'Lǐ Qīngzhào', 'LI_QINGZHAO_GLOSS' )], and her husband, the equally intellectual [Glossary( 'Zhào Míngchéng', 'ZHAO_MINGCHENG_GLOSS' )]. According to Lǐ Qīngzhào's memoirs, she and her husband would often play a game where they would test each other's memory and knowledge of literature on where certain lines could be found in a book, while enjoying tea, and the winner would be allowed to drink their cup of tea first. Their excitement and laughter during these intellectual games would cause them to spill their cups. The story is often used as a metaphor for a loving and intellectual couple."
 LI_QINGZHAO_GLOSS: "#bold Lǐ Qīngzhào#! (1084-1155 CE) was a Sòng Dynasty poet, and considered one of the greatest female poets in Chinese history. Her affectionate, loving marriage with her equally intellectual and beloved husband [Glossary( 'Zhào Míngchéng', 'ZHAO_MINGCHENG_GLOSS' )] is well-known, exemplified by stories such as [Glossary( 'betting on books and spilling tea', 'BETTING_ON_BOOKS_GLOSS' )]. As is the sorrow and heartache she felt after they fled the conquest of the Northern Sòng by the Jurchen, and his untimely death in 1129."
 ZHAO_MINGCHENG_GLOSS: "#bold Zhào Míngchéng#! (1081-1129 CE) was a Sòng Dynasty politician and scholar who was most famously married to [Glossary( 'Lǐ Qīngzhào', 'LI_QINGZHAO_GLOSS' )], considered one of China's greatest female poets, and with whom he shared a loving, affectionate, and highly intellectual marriage, exemplified by stories such as [Glossary( 'betting on books and spilling tea', 'BETTING_ON_BOOKS_GLOSS' )]. Though not as famous as his wife, he was nonetheless an important antiquarian and epigrapher of his time."
