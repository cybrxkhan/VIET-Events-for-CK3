 ONEIROKRITIKA_GLOSS: "Like in many societies around the world, the people of the Byzantine Empire were fascinated by dreams and their potential meanings. Byzantine dream-key manuals, called #bold oneirokritika#! (singular #italic oneirokritikon#!), were popular especially among the literate upper-classes; there were even manuals written for the imperial court. #italic Oneirokritika#! were often formulaic reference books, written in the format of “x means y,” drawing influences mainly from the Bible and ancient Greco-Roman traditions. "
 GAROS_GLOSS: "A fermented fish sauce known as #bold Garos#! (in Greek), or #bold Garum#! (in Latin) was an important, popular condiment in ancient Mediterranean cuisine. Greatly widespread throughout the Roman Empire, it remained popular in the eastern Roman Empire well into the medieval period. A similar though distinct medieval Middle Eastern and North African condiment called #bold murri#! may have been derived from or influenced by #italic garos#!."
